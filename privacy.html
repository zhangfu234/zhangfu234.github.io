<h1>隐私政策</h1>
<p>生效日期：2026年</p >
<p>本应用为照片整理工具，面向内部人员使用。</p >
<h2>1. 数据收集</h2>
<p>本App不会自动收集、上传用户照片到任何服务器。照片仅保存在用户本地手机。</p >
<p>App仅在用户手动选择照片时，可由用户主动通过局域网传输照片到用户自己的电脑，不会上传至公网。</p >
<p>App不会收集手机号、位置等个人信息。</p >
<h2>2. 数据使用</h2>
<p>所有图片处理、识别计算均在用户设备本地执行，图片不会上传到第三方服务器。</p >
<h2>3. 数据共享</h2>
<p>我们不会向任何第三方共享、出售用户照片与个人数据。</p >
